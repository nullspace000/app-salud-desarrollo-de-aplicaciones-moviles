<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-background":"#0d1c2e","secondary-fixed":"#7df4ff","surface-bright":"#f8f9ff","surface-container-low":"#eff4ff","tertiary":"#595c5e","outline":"#727784","on-primary-fixed-variant":"#00458e","tertiary-fixed":"#e0e3e5","surface-container-lowest":"#ffffff","on-surface":"#0d1c2e","on-tertiary-container":"#fbfdff","on-secondary":"#ffffff","on-surface-variant":"#414753","outline-variant":"#c1c6d5","surface-dim":"#ccdbf3","on-primary":"#ffffff","on-error":"#ffffff","on-secondary-container":"#006e75","inverse-on-surface":"#eaf1ff","secondary-fixed-dim":"#5dd8e2","secondary-container":"#7af1fc","error":"#ba1a1a","surface-tint":"#005db9","background":"#f8f9ff","secondary":"#006970","on-primary-fixed":"#001b3e","inverse-surface":"#233144","surface-container-highest":"#d5e3fc","primary":"#005ab5","inverse-primary":"#aac7ff","on-tertiary-fixed":"#191c1e","surface-container-high":"#dce9ff","surface-variant":"#d5e3fc","tertiary-fixed-dim":"#c4c7c9","on-tertiary":"#ffffff","on-secondary-fixed-variant":"#004f54","primary-fixed-dim":"#aac7ff","surface":"#f8f9ff","primary-container":"#1b73db","surface-container":"#e6eeff","tertiary-container":"#727577","on-error-container":"#93000a","on-secondary-fixed":"#002022","on-primary-container":"#fefcff","on-tertiary-fixed-variant":"#444749","primary-fixed":"#d6e3ff","error-container":"#ffdad6"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"stack-md":"24px","container-margin":"20px","touch-target-min":"48px","stack-sm":"12px","base":"8px","gutter":"16px"},"fontFamily":{"body-md":["Atkinson Hyperlegible Next"],"headline-lg-mobile":["Atkinson Hyperlegible Next"],"dosage-display":["Atkinson Hyperlegible Next"],"body-lg":["Atkinson Hyperlegible Next"],"headline-md":["Atkinson Hyperlegible Next"],"label-bold":["Atkinson Hyperlegible Next"],"headline-lg":["Atkinson Hyperlegible Next"]},"fontSize":{"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-lg-mobile":["26px",{"lineHeight":"32px","fontWeight":"700"}],"dosage-display":["40px",{"lineHeight":"48px","fontWeight":"800"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"label-bold":["14px",{"lineHeight":"20px","fontWeight":"700"}],"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}]}}}}</script></head><body class="bg-background font-body-md text-on-background flex flex-col min-h-screen"><main class="flex-grow flex flex-col relative w-full pt-safe pb-safe bg-background"><div class="flex flex-col w-full min-h-[100dvh] bg-surface relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute top-0 left-0 w-full h-[40vh] bg-gradient-to-b from-surface-container-high/50 to-transparent z-0"></div>
<div class="absolute top-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/20 blur-3xl z-0"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/10 blur-3xl z-0"></div>
<!-- Main Content Container -->
<div class="flex flex-col flex-grow relative z-10 px-container-margin py-stack-md justify-center w-full max-w-md mx-auto">
<!-- Logo & Header -->
<div class="flex flex-col items-center mb-stack-md">
<div class="w-24 h-24 rounded-2xl bg-surface-container-lowest shadow-sm flex items-center justify-center mb-stack-sm p-4 ring-1 ring-outline-variant/30">
<img alt="Serene Care Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UgNOAxzgtqrR8R4SnsAkwh3bdW0D4nu2W1yAyA7uhjIXWEf2Z514mYvy6nL2qtFqAGh0QkCt7mlwL9-fymobxjOIuHOEGx6lNtNcbAwkrQuKOXwv8gL7ESsSTMB9i_Yyj9swFHoMR3VosYvBsipoKlUk2WePNBtQzkNXcn7MxOHJCacBiR-Gp3GmA4DuIZzeZEPjdNTsltcufBsarP96aVqWRwBynAeDvFvw5Zkus55yGxyv_S2eEHOzo"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-base">Bienvenido de nuevo</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Tu salud es lo primero</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-stack-sm w-full bg-surface-container-lowest p-stack-sm rounded-xl shadow-md border border-outline-variant/20 mb-stack-md">
<!-- Email Field -->
<div class="flex flex-col group">
<label class="font-label-bold text-label-bold text-on-surface mb-base ml-1" for="email">Correo Electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-touch-target-min pl-10 pr-4 bg-surface rounded-lg text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant border border-outline-variant/50" id="email" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col group">
<label class="font-label-bold text-label-bold text-on-surface mb-base ml-1" for="password">Contraseña</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-touch-target-min pl-10 pr-12 bg-surface rounded-lg text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant border border-outline-variant/50" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-1 w-10 h-10 flex items-center justify-center text-outline hover:text-on-surface transition-colors focus:outline-none rounded-full" id="toggle-password" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end w-full mt-1">
<a class="font-label-bold text-label-bold text-primary hover:text-on-primary-fixed-variant transition-colors p-2 -mr-2" href="#">¿Olvidé mi contraseña?</a>
</div>
<!-- Primary Action -->
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-full font-label-bold text-label-bold mt-2 shadow-sm hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
        Iniciar Sesión
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 w-full mb-stack-md px-4">
<div class="h-px bg-outline-variant/40 flex-grow"></div>
<span class="font-body-md text-body-md text-outline">o</span>
<div class="h-px bg-outline-variant/40 flex-grow"></div>
</div>
<!-- Secondary Action -->
<div class="flex flex-col items-center gap-2">
<p class="font-body-md text-body-md text-on-surface-variant">¿Eres nuevo en Serene Care?</p>
<button class="w-full h-touch-target-min bg-secondary-container text-on-secondary-container rounded-full font-label-bold text-label-bold shadow-sm hover:bg-secondary-fixed active:scale-[0.98] transition-all" type="button">
        Crear una cuenta
      </button>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const visibilityIcon = document.getElementById('visibility-icon');

      if(togglePasswordBtn && passwordInput && visibilityIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
          
          // Small playful bounce animation on the icon
          visibilityIcon.style.transform = 'scale(0.8)';
          setTimeout(() => {
            visibilityIcon.style.transform = 'scale(1)';
            visibilityIcon.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          }, 50);
        });
      }
    });
  </script>
</div></main></body></html>
