<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-background":"#0d1c2e","secondary-fixed":"#7df4ff","surface-bright":"#f8f9ff","surface-container-low":"#eff4ff","tertiary":"#595c5e","outline":"#727784","on-primary-fixed-variant":"#00458e","tertiary-fixed":"#e0e3e5","surface-container-lowest":"#ffffff","on-surface":"#0d1c2e","on-tertiary-container":"#fbfdff","on-secondary":"#ffffff","on-surface-variant":"#414753","outline-variant":"#c1c6d5","surface-dim":"#ccdbf3","on-primary":"#ffffff","on-error":"#ffffff","on-secondary-container":"#006e75","inverse-on-surface":"#eaf1ff","secondary-fixed-dim":"#5dd8e2","secondary-container":"#7af1fc","error":"#ba1a1a","surface-tint":"#005db9","background":"#f8f9ff","secondary":"#006970","on-primary-fixed":"#001b3e","inverse-surface":"#233144","surface-container-highest":"#d5e3fc","primary":"#005ab5","inverse-primary":"#aac7ff","on-tertiary-fixed":"#191c1e","surface-container-high":"#dce9ff","surface-variant":"#d5e3fc","tertiary-fixed-dim":"#c4c7c9","on-tertiary":"#ffffff","on-secondary-fixed-variant":"#004f54","primary-fixed-dim":"#aac7ff","surface":"#f8f9ff","primary-container":"#1b73db","surface-container":"#e6eeff","tertiary-container":"#727577","on-error-container":"#93000a","on-secondary-fixed":"#002022","on-primary-container":"#fefcff","on-tertiary-fixed-variant":"#444749","primary-fixed":"#d6e3ff","error-container":"#ffdad6"},"borderRadius":{"DEFAULT":"0.25r   </head><body class="bg-background font-body-md text-on-background flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-4 flex items-center gap-gutter"><button class="w-12 h-12 flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><div class="flex flex-col"><h1 class="font-headline-md text-headline-md text-on-surface truncate">Añadir</h1></div></div></header><main class="flex-grow flex flex-col relative w-full pt-16 bg-background"><div class="flex flex-col w-full pb-safe">
<div class="px-5 pt-6 pb-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Nuevo Medicamento</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa los detalles para tu recordatorio.</p>
</div>
<form class="flex flex-col gap-6 px-5" onsubmit="event.preventDefault(); this.querySelector('button[type=submit]').innerHTML = '&lt;span class=\'material-symbols-outlined animate-spin\'&gt;progress_activity&lt;/span&gt; Guardando...'; setTimeout(() =&gt; history.back(), 800);">
<!-- Medication Name -->
<div class="flex flex-col gap-2 relative">
<label class="font-label-bold text-label-bold text-on-surface" for="medName">Nombre del medicamento</label>
<div class="relative bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)] focus-within:shadow-[0_4px_15px_rgba(0,90,181,0.15)] transition-shadow duration-200">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">pill</span>
<input class="w-full h-14 bg-transparent pl-12 pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant outline-none rounded-xl" id="medName" placeholder="Ej. Paracetamol" required="" type="text"/>
</div>
</div>
<!-- Dosage & Unit -->
<div class="flex flex-col gap-2 relative z-10">
<label class="font-label-bold text-label-bold text-on-surface">Dosis</label>
<div class="flex gap-3">
<div class="relative flex-1 bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)] focus-within:shadow-[0_4px_15px_rgba(0,90,181,0.15)] transition-shadow duration-200">
<input class="w-full h-14 bg-transparent px-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant outline-none rounded-xl" id="medDosage" placeholder="500" required="" type="number"/>
</div>
<div class="relative w-28 bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)] flex items-center justify-between px-3 cursor-pointer" onclick="document.getElementById('unitDropdown').classList.toggle('hidden')">
<span class="font-body-md text-body-md text-on-surface" id="selectedUnit">mg</span>
<span class="material-symbols-outlined text-outline">expand_more</span>
<div class="hidden absolute top-full left-0 right-0 mt-2 bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden py-2 z-20" id="unitDropdown">
<div class="px-4 py-2 hover:bg-surface-container-low cursor-pointer font-body-md text-on-surface" onclick="document.getElementById('selectedUnit').innerText='mg';">mg</div>
<div class="px-4 py-2 hover:bg-surface-container-low cursor-pointer font-body-md text-on-surface" onclick="document.getElementById('selectedUnit').innerText='ml';">ml</div>
<div class="px-4 py-2 hover:bg-surface-container-low cursor-pointer font-body-md text-on-surface" onclick="document.getElementById('selectedUnit').innerText='g';">g</div>
<div class="px-4 py-2 hover:bg-surface-container-low cursor-pointer font-body-md text-on-surface" onclick="document.getElementById('selectedUnit').innerText='gotas';">gotas</div>
</div>
</div>
</div>
</div>
<!-- Frequency -->
<div class="flex flex-col gap-3">
<label class="font-label-bold text-label-bold text-on-surface">Frecuencia</label>
<div class="grid grid-cols-2 gap-3">
<label class="relative cursor-pointer">
<input checked="" class="peer sr-only" name="frequency" type="radio"/>
<div class="h-14 rounded-xl bg-surface-container-lowest shadow-[0_4px_15px_rgba(0,0,0,0.04)] flex items-center justify-center font-body-md text-body-md text-on-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">
            Cada 8 horas
          </div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="frequency" type="radio"/>
<div class="h-14 rounded-xl bg-surface-container-lowest shadow-[0_4px_15px_rgba(0,0,0,0.04)] flex items-center justify-center font-body-md text-body-md text-on-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">
            Cada 12 horas
          </div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="frequency" type="radio"/>
<div class="h-14 rounded-xl bg-surface-container-lowest shadow-[0_4px_15px_rgba(0,0,0,0.04)] flex items-center justify-center font-body-md text-body-md text-on-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">
            1 vez al día
          </div>
</label>
<label class="relative cursor-pointer">
<input class="peer sr-only" name="frequency" onclick="document.getElementById('customFreqModal').classList.remove('hidden')" type="radio"/>
<div class="h-14 rounded-xl bg-surface-container-lowest shadow-[0_4px_15px_rgba(0,0,0,0.04)] flex gap-2 items-center justify-center font-body-md text-body-md text-on-surface peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">tune</span> Otro
          </div>
</label>
</div>
</div>
<!-- Duration -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface">Duración del tratamiento</label>
<div class="grid grid-cols-2 gap-3">
<div class="relative bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)] p-3">
<span class="block font-label-bold text-label-bold text-on-surface-variant text-xs mb-1">Inicio</span>
<input class="w-full bg-transparent font-body-md text-on-surface outline-none" type="date" value="2024-05-20"/>
</div>
<div class="relative bg-surface-container-lowest rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.04)] p-3">
<span class="block font-label-bold text-label-bold text-on-surface-variant text-xs mb-1">Días</span>
<input class="w-full bg-transparent font-body-md text-on-surface outline-none placeholder:text-outline-variant" placeholder="Continuo" type="number"/>
</div>
</div>
</div>
<div class="mt-8 mb-6">
<button class="w-full h-14 rounded-full bg-primary flex items-center justify-center gap-2 text-on-primary font-label-bold text-[18px] shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        Guardar Medicamento
      </button>
</div>
</form>
<!-- Custom Frequency Modal (Hidden) -->
<div class="hidden fixed inset-0 z-50 bg-inverse-surface/40 backdrop-blur-md flex items-end sm:items-center justify-center" id="customFreqModal">
<div class="bg-surface-container-lowest w-full sm:w-96 rounded-t-[32px] sm:rounded-[32px] p-6 shadow-2xl animate-[slideUp_0.3s_ease-out]">
<div class="flex justify-between items-center mb-6">
<h3 class="font-headline-md text-headline-md text-on-surface">Frecuencia Personalizada</h3>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface" onclick="document.getElementById('customFreqModal').classList.add('hidden'); document.querySelectorAll('input[name=\'frequency\']')[0].checked = true;" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex items-center gap-4 mb-8">
<span class="font-body-lg text-body-lg text-on-surface">Cada</span>
<div class="relative w-24 bg-surface-container rounded-xl">
<input class="w-full h-14 bg-transparent text-center font-dosage-display text-dosage-display text-primary outline-none" type="number" value="4"/>
</div>
<span class="font-body-lg text-body-lg text-on-surface">horas</span>
</div>
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-label-bold text-[18px]" onclick="document.getElementById('customFreqModal').classList.add('hidden')" type="button">
        Aplicar
      </button>
</div>
</div>
<style>
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
<script>
    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('unitDropdown');
      const container = dropdown.parentElement;
      if (!container.contains(e.target)) {
        dropdown.classList.add('hidden');
      }
    });
  </script>
</div></main></body></html>
