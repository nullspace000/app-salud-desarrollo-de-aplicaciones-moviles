<script>
    // Simple custom toggle behavior to apply Tailwind color classes on check
    document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
      const label = checkbox.nextElementSibling;
      
      const updateToggleStyle = () => {
        if (checkbox.checked) {
          label.classList.remove('bg-surface-variant');
          label.classList.add('bg-primary');
        } else {
          label.classList.remove('bg-primary');
          label.classList.add('bg-surface-variant');
        }
      };

      // Init
      updateToggleStyle();

      // Change event
      checkbox.addEventListener('change', updateToggleStyle);
    });
