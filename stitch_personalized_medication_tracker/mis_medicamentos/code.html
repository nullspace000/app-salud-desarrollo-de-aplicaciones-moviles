<script>
  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('searchInput');
    const medCards = document.querySelectorAll('.med-card');
    const emptyState = document.getElementById('emptyState');
    const medicationList = document.getElementById('medicationList');

    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      let visibleCount = 0;

      medCards.forEach(card => {
        const text = card.querySelector('h3').textContent.toLowerCase() + ' ' + card.querySelector('p').textContent.toLowerCase();
        if (text.includes(searchTerm)) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      if (visibleCount === 0) {
        medicationList.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        medicationList.classList.remove('hidden');
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }
    });
  });
